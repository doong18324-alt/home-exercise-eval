{k:'몸단장',q:'머리 빗질이나 손발톱 깎는 것, 화장(여자), 면도(남자)를 남의 도움 없이 혼자서 하십니까?',o:['(기구만 준비되어 있으면) 다른 사람의 도움 없이 혼자서 빗질, 화장 혹은 면도, 손/발톱 깎기를 혼자서 한다.','(기구가 준비되어 있더라도) 빗질, 화장, 면도, 손/발톱 깎기 중 한두 가지는 다른 사람의 도움을 받아야 한다.','(기구가 준비되어 있더라도) 타인의 도움을 받지 않고는 빗질, 화장, 면도, 손/발톱 깎기 등을 모두 하지 못한다.']},
{k:'집안일',q:'집안의 일상적인 청소나 정리정돈, 침구정리, 설거지 등을 다른 사람의 도움 없이 혼자서 하십니까?',o:['도움 없이 혼자서 집안일을 한다.','집안일을 할 때 부분적으로 다른 사람의 도움을 받는다.','집안일을 할 수 없어서 다른 사람의 도움에 전적으로 의존한다.'],na:1},
{k:'식사 준비',q:'식사준비(음식재료를 준비하고 요리를 하고 밥상을 차리는 일)를 다른 사람의 도움 없이 혼자서 하십니까?',o:['도움 없이 혼자서 식사 준비를 한다.','식사 준비를 할 때 부분적으로 다른 사람의 도움을 받는다.','식사 준비를 할 수 없어서 전적으로 다른 사람의 도움에 의존한다.'],na:1},
{k:'빨래하기',q:'빨래(손으로 빨든 세탁기를 이용하든 상관없이)를 다른 사람의 도움 없이 혼자서 하십니까?',o:['도움 없이 혼자서 빨래를 한다.','빨래를 할 때 부분적으로 다른 사람의 도움을 받는다.','빨래를 할 수 없어서 전적으로 다른 사람의 도움에 의존한다.'],na:1},
{k:'근거리 외출',q:'걸어서 갔다 올 수 있는 상점이나 이웃, 병원, 관공서 같은 가까운 곳의 외출을 다른 사람의 도움 없이 혼자서 하십니까?',o:['도움 없이 혼자서 근거리 외출을 한다.','혼자서는 외출을 못하지만 도움을 받아 외출을 한다.','도움을 받아도 외출을 전혀 하지 못한다.']},

{k:'물건 사기(쇼핑)',q:'사고 싶은 물건을 사려고 상점에 갔을 때 다른 사람의 도움 없이 혼자서 구입하십니까?',o:['도움 없이 혼자서 필요한 물건을 모두 구입한다.','한두 가지 물건은 혼자서 구입할 수 있으나, 여러 가지 물건을 살 때는 다른 사람의 도움이 필요하다.','어떠한 물건을 사든지 다른 사람이 동행해 주어야 한다.','혼자서 쇼핑을 전혀 할 수 없으며, 다른 사람이 필요한 물건을 대신 사다 주어야 한다.']},

{k:'전화 사용',q:'전화를 걸고 받는 일을 다른 사람의 도움 없이 혼자서 하십니까?',o:['혼자서 전화번호를 찾고 또 전화를 걸 수 있다.','알고 있는 전화번호 몇 개만 걸 수 있다.','전화를 받을 수 있지만 걸지는 못한다.','전화를 걸지도 받지도 못한다.']},

const calfCut=()=>((A.pre.reg||{}).sex==='여'?33:34);

case'yubi':return!!a.yubi;case'iadl':return IAD.every((_,j)=>a['ia'+j]!==undefined&&a['ia'+j]!=='');case'ipaq':return['vd','vt','md','mt','wd','wt','st'].every(k=>a.ipaq&&a.ipaq[k]!==undefined&&a.ipaq[k]!=='');case'multi':return(a[q.key]||[]).length>0;case'nrs':return a.nrs!==undefined;case'mc':return!!a.clock;
case'gas':return!!(a.goals&&a.goals[0]&&a.goals[0].lib&&a.goals[0].base);case'gasr':return(A.pre.goals||[]).filter(g=>g.lib&&g.base).every((_,g)=>a.achv&&a.achv[g]);default:return true}}
const J=(d,t)=>d>=t?['개선','success']:d<=-t?['악화','danger']:['유지','neutral'];
const tg=(t,k)=>`<span class="tag" style="background:var(--bg-${k});color:var(--text-${k})">${t}</span>`;
function result(){const p=A.pre,q=A.post;const s0=stg(+p.fac,p.sit),s1=stg(+q.fac,q.sit),core=[];
const r=p.reg||{},b0=bmiOf(+r.ht,+r.wt),b1=bmiOf(+r.ht,+q.wt);let h=`<div style="font-size:16px;font-weight:600;margin-bottom:4px">${r.nm||''} 님 · ${r.id||''} · ${ageOf(r.birth)??''}세 ${r.sex||''}</div><div style="margin-bottom:4px">생활공간 표현형 ${'ⅠⅡⅢⅣⅤ'[s0-1]} ${NM[s0-1]} → ${'ⅠⅡⅢⅣⅤ'[s1-1]} ${NM[s1-1]}</div><div style="margin-bottom:8px">사후 꼬리표: ${TAGS(q)||'없음'}</div>${radarBlock([{n:'사전',o:doms(p),c:'#8e8e93',f:0.15},{n:'사후',o:doms(q),c:'#007aff',f:0.25}])}<div class="how" style="margin-top:10px">저장 시 「사후평가」와 「결과」 시트에 각 1행 추가</div><div class="rr" style="font-weight:500"><div>항목</div><div>사전 → 사후</div><div>판정 (기준)</div></div>`;
const add=(n,v,j,c)=>{h+=`<div class="rr"><div>${n}</div><div>${v}</div><div>${tg(j[0],j[1])} ${c}</div></div>`};
let j=J(s1-s0,1);core.push(j[0]);add('기능 단계',`${s0} → ${s1}단계`,j,'1단계');
if(p.fac>=3&&q.fac>=3){const a=spTot(p),b=spTot(q);j=J(b-a,1);core.push(j[0]);add('SPPB',`${a} → ${b}`,j,'1.0점');
if(p.gait.t&&q.gait.t){const g0=p.gait.d/p.gait.t,g1=q.gait.d/q.gait.t,dg=Math.round((g1-g0)*100)/100;add('보행속도',`${g0.toFixed(2)} → ${g1.toFixed(2)} m/s`,J(dg,0.1),'0.10 m/s')}}else add('SPPB','실시 불가 포함',['판정 제외','neutral'],'');
{const m0=gMax(p.grip),m1=gMax(q.grip);if(m0>0&&m1>0)add('악력',`${m0} → ${m1} kg`,m1<gCut()?['근력 저하','warning']:['기준 이상','success'],`기준 ${gCut()}kg`)}
const k0=kmTot(p),k1=kmTot(q);j=J(k1-k0,15);core.push(j[0]);add('K-MBI',`${k0} → ${k1} (${k1-k0>0?'+':''}${k1-k0})`,j,'잠정 15점');
const l0=lsaTot(p),l1=lsaTot(q);add('K-LSA (참여)',`${l0} → ${l1} (${l1-l0>0?'+':''}${l1-l0})`,['참고','neutral'],'기준 미확정');
add('손가락 고리',`${p.yubi} → ${q.yubi}`,q.yubi==='작음'?['근감소 의심','warning']:['참고','neutral'],'');
if(p.calf&&q.calf)add('종아리 둘레',`${p.calf} → ${q.calf} cm`,+q.calf<calfCut()?['근감소 선별 양성','warning']:['참고','neutral'],'');
add('K-IADL',`${iaTot(p)} → ${iaTot(q)}점 (도움 필요 ${iaDep(p)} → ${iaDep(q)}개)`,iaN(p)===iaN(q)?J(iaTot(p)-iaTot(q),1):['채점 문항 수 다름','neutral'],'');
add('신체활동',`${ipMet(p)} → ${ipMet(q)} MET-분/주`,['참고','neutral'],'');
if(+p.nrs>=1)add('통증 NRS',`${p.nrs} → ${q.nrs} (${p.ptype})`,J(p.nrs-q.nrs,2),'개인 2점');
if(b0&&b1){const dw=Math.round((q.wt-r.wt)*10)/10,pc=dw/r.wt*100;add('몸무게',`${r.wt} → ${q.wt} kg (BMI ${b0} → ${b1})`,pc<=-5?['5% 이상 감소','warning']:['참고','neutral'],'5% 감소 시 영양 확인')}
if(p.fr&&q.fr){const f0=frTot(p),f1=frTot(q);add('K-FRAIL',`${f0} → ${f1}`,J(f0-f1,1),'1점')}
if(p.fall&&q.fall){const a0=fesTot(p),a1=fesTot(q);add('Short FES-I',`${a0} → ${a1}`,['참고','neutral'],'기준 미확정')}
if(p.mo&&q.mo){add('PHQ-2',`${phqT(p)} → ${phqT(q)}`,phqT(q)>=3?['선별 양성','warning']:['참고','neutral'],'3점')}
add('EQ-5D VAS',`${p.vas} → ${q.vas}`,['참고','neutral'],'효용값은 한국 가치세트');
const gs=(p.goals||[]).filter(g=>g.lib&&g.base),xs=gs.map((G,g)=>gasScore(+G.base,+(q.achv||[])[g]));
const T=xs.length?Math.round((50+10*xs.reduce((x,y)=>x+y,0)/Math.sqrt(0.7*xs.length+0.3*xs.length**2))*10)/10:'-';
add('GAS T점수',gs.map((G,g)=>GLIB[G.lib][0]+' '+(xs[g]>0?'+':'')+xs[g]).join(', '),T>50?['기대 이상','success']:T==50?['기대 수준','neutral']:['기대 미달','warning'],String(T));
const imp=core.filter(c=>c==='개선').length,wor=core.filter(c=>c==='악화').length,ov=wor?'재평가 필요':imp>=2?'개선':imp?'부분 개선':'유지';
const guard=mcS(p)<=2||p.resp!=='직접응답'||q.presp!=='직접응답',mism=+q.grc<=3&&J(k1-k0,15)[0]==='유지';
h+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px">${[['종합 판정',ov,'핵심 지표 개선 '+imp+'개'],['배정 영상',s1+'단계 '+NM[s1-1],guard?'보호자 동반 표시':'혼자 가능'],['다음 단계 조건',s1<5?['혼자 앉기 가능','FAC 1 이상','FAC 3 이상','FAC 5'][s1-1]:'유지 관리','도달 시 상위 영상']].map(c=>`<div style="background:var(--bg-neutral);border-radius:var(--radius);padding:10px"><div style="font-size:12px;color:var(--text-secondary)">${c[0]}</div><div style="font-size:16px;font-weight:500;margin-top:4px">${c[1]}</div><div style="font-size:12px;color:var(--text-secondary)">${c[2]}</div></div>`).join('')}</div>`;
if(mism)h+=`<div class="say">체감은 좋아졌으나 K-MBI 유지 판정: 재가 노인 K-MBI 기준 산출용 사례로 자동 표시</div>`;
if((p.struct||[]).some(s=>s!=='없음'))h+=`<div class="how">신체구조 체크: ${p.struct.join(', ')} (운동 처방 시 고려)</div>`;return h}
const logT=()=>{const q=list()[i],a=A[mode];if(!q)return;a._t=a._t||{};a._t[q.id]=Math.round(((a._t[q.id]||0)+(performance.now()-tStart)/1000)*10)/10};
document.getElementById('nx').onclick=()=>{const q=list()[i];logT();if(!valid(q)){document.getElementById('err').textContent='응답을 입력해야 다음으로 넘어갑니다.';return}i++;render()};
document.getElementById('pv').onclick=()=>{logT();i--;render()};
document.querySelectorAll('.md[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;i=0;document.querySelectorAll('.md[data-m]').forEach(x=>x.classList.toggle('on',x===b));render()});
document.getElementById('fill').onclick=()=>{A={pre:clone(EX.pre),ses:clone(EX.ses),post:clone(EX.post)};render()};
document.getElementById('reset').onclick=()=>{A[mode]=mode==='post'?{}:{};if(mode==='pre')A.pre={};render()};
document.querySelector('.md[data-m="pre"]').classList.add('on');render();
</script>
